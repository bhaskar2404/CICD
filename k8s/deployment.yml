apiVersion: apps/v1
kind: Deployment
metadata:
   name:  springboot-deployment
   labels:
     app: springboot-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app:  springboot-app
  template:
    metadata:
      labels:
        app:  springboot-app
    spec:
      containers:
        - name: springboot-container
          image:  bhaskarvanam/spring-boot:v1
          ports:
            - containerPort: 8080