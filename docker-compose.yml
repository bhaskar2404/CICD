services:
  jenkins:
    container_name: jenkins
    build:
      context:  ./jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/var/jenkins_home/.kube

volumes:
  jenkins_home:
    external: true